        const MAP_W = 280,
          MAP_D = 330;
        const BASE_Y = -26; // base da placa continental

        const H = new Float32Array(VX * VZ); // altura por vértice
        const CORV = new Float32Array(VX * VZ * 3); // cor base por vértice
        const EMISV = new Uint8Array(VX * VZ); // vértice emissivo (lava/veios)
        const EMCOR = new Float32Array(VX * VZ * 3); // cor emissiva
        const MARV = new Uint8Array(VX * VZ); // vértice de mar/ névoa (face não desenhada)
        const WX = new Float32Array(VX); // coordenadas fixas do plano
        const WZ = new Float32Array(VZ);

        function vidar(ix, iz) {
          return iz * VX + ix;
        }

        /* Paleta por bioma — as chaves são exatamente o campo "bioma" da API.
   Tons de base contidos: o brilho fica por conta do emissivo e dos pins. */
        const BIOMAS = {
          "Tundra Glacial": { a: [220, 232, 242], b: [184, 204, 221] },
          "Zona Temperada": { a: [92, 134, 88], b: [70, 108, 72] },
          "Montanhas de Dente de Dragão": {
            a: [142, 147, 166],
            b: [116, 122, 140]
          },
          "Ravinas Arcanas": { a: [84, 72, 104], b: [54, 46, 74] },
          "Floresta de Mana": { a: [52, 118, 102], b: [127, 191, 176] },
          "Vales Sepulcrais": { a: [154, 160, 172], b: [92, 100, 112] },
          "Planalto Vulcânico": { a: [172, 56, 38], b: [204, 86, 46] },
          "Transição Selva-Deserto": { a: [134, 76, 54], b: [90, 58, 52] },
          "Fenda Cósmica": { a: [10, 14, 26], b: [127, 212, 255] },
          "Cidadelas-Torre": { a: [128, 148, 150], b: [88, 108, 110] },
          "Marca Fronteiriça": { a: [128, 118, 90], b: [92, 85, 65] },
          "Altiplano Ocidental": { a: [150, 127, 90], b: [115, 96, 68] },
          "Cinturão Bruto": { a: [112, 114, 98], b: [72, 76, 64] },
          "Subsolo Vulcânico": { a: [124, 74, 62], b: [80, 46, 40] },
          "Caldeira Selada": { a: [94, 62, 100], b: [58, 38, 64] },
          "Campo de Ruínas": { a: [142, 134, 118], b: [104, 98, 86] }
        };

        function alturaBioma(bioma, u, v) {
          switch (bioma) {
            case "Tundra Glacial":
              return 7 + fbm(u * 3, v * 3) * 4 + Math.pow(crista(u * 4.2, v * 4.2), 2.4) * 13;
            case "Zona Temperada":
              return 4.5 + fbm(u * 3.4, v * 3.4) * 3.5;
            case "Montanhas de Dente de Dragão":
              return 14 + Math.pow(crista(u * 3.6, v * 3.6), 2.6) * 32;
            case "Ravinas Arcanas":
              return -3 + fbm(u * 3, v * 3) * 2.5;
            case "Floresta de Mana":
              return 5.5 + fbm(u * 3.2, v * 3.2) * 3;
            case "Vales Sepulcrais":
              return 3.5 + fbm(u * 2.6, v * 2.6) * 1.6;
            case "Planalto Vulcânico":
              return 11 + fbm(u * 3, v * 3) * 4.5;
            case "Transição Selva-Deserto":
              return 7.5 + fbm(u * 3.3, v * 3.3) * 3.5;
            case "Fenda Cósmica":
              return -2 + fbm(u * 3, v * 3) * 2;
            case "Cidadelas-Torre":
              return 8 + Math.pow(crista(u * 4.6, v * 4.6), 3) * 11 + fbm(u * 3, v * 3) * 2;
            case "Marca Fronteiriça":
              return 6 + fbm(u * 3.1, v * 3.1) * 2.5;
            case "Altiplano Ocidental":
              return 12 + fbm(u * 2.8, v * 2.8) * 2.5;
            case "Cinturão Bruto":
              return 5 + fbm(u * 3.4, v * 3.4) * 4 + Math.pow(crista(u * 3.8, v * 3.8), 3) * 8;
            case "Subsolo Vulcânico":
              return 9 + fbm(u * 3.2, v * 3.2) * 3;
            case "Caldeira Selada":
              return 3 + fbm(u * 3, v * 3) * 2;
            case "Campo de Ruínas":
              return 4.5 + fbm(u * 3.3, v * 3.3) * 2.8;
          }
          return 6;
        }

        function construirTerreno() {
          for (let j = 0; j < VZ; j++) {
            WZ[j] = (j / ROWS - 0.5) * MAP_D;
          }
          for (let i = 0; i < VX; i++) {
            WX[i] = (i / COLS - 0.5) * MAP_W;
          }
          const tmp = {
            h: 0,
            r: 0,
            g: 0,
            b: 0,
            e: 0,
            er: 0,
            eg: 0,
            eb: 0,
            mar: 0
          };
          for (let j = 0; j < VZ; j++) {
            for (let i = 0; i < VX; i++) {
              calcularVertice(i / COLS, j / ROWS, tmp);
              const vi = vidar(i, j);
              H[vi] = tmp.h;
              CORV[vi * 3] = tmp.r;
              CORV[vi * 3 + 1] = tmp.g;
              CORV[vi * 3 + 2] = tmp.b;
              EMISV[vi] = tmp.e;
              EMCOR[vi * 3] = tmp.er;
              EMCOR[vi * 3 + 1] = tmp.eg;
              EMCOR[vi * 3 + 2] = tmp.eb;
              MARV[vi] = tmp.mar;
            }
          }
          // coerência espacial do emissivo: um vértice só brilha se tiver vizinho
          // candidato — as fissuras formam linhas conectadas, não pontos isolados
          for (let j = 0; j < VZ; j++) {
            for (let i = 0; i < VX; i++) {
              const vi = vidar(i, j);
              if (!EMISV[vi]) continue;
              const viz =
                (i > 0 && EMISV[vi - 1]) ||
                (i < VX - 1 && EMISV[vi + 1]) ||
                (j > 0 && EMISV[vi - VX]) ||
                (j < VZ - 1 && EMISV[vi + VX]);
              if (!viz) EMISV[vi] = 0;
            }
          }
        }

        function calcularVertice(u, v, out) {
          /* máscara continental: elipse central deformada por ruído angular
     (penínsulas e baías quebram a silhueta arredondada) + falésia nas bordas */
          const borda = sstep(0.02, 0.11, Math.min(u, 1 - u, v, 1 - v));
          const ang = Math.atan2((v - 0.52) * 1.1, u - 0.5);
          const warp = 1 + 0.2 * fbm(Math.cos(ang) * 1.25 + 9.7, Math.sin(ang) * 1.25 + 3.1);
          const rr =
            ((u - 0.5) / 0.46) * ((u - 0.5) / 0.46) + ((v - 0.52) / 0.5) * ((v - 0.52) / 0.5);
          const massa = Math.exp(-(rr / warp) * 1.35);

          // ilhotas costeiras (fragmentos de arquipélago), imunes à falésia da borda
          const ilha = (cx, cy, rad) => {
            const a = (u - cx) / rad,
              b = (v - cy) / (rad * 1.25);
            return Math.exp(-(a * a + b * b));
          };
          const iA = ilha(0.052, 0.325, 0.034),
            iB = ilha(0.95, 0.478, 0.031);

          let terra =
            clamp(massa * 1.28 - 0.44 + fbm(u * 2.2 + 7.3, v * 2.2 + 2.9) * 0.3, 0, 1) * borda;
          terra = Math.max(terra, iA * 0.85, iB * 0.8);

          // influência biômica das regiões (o peso máximo também garante terra sob cada uma)
          let somaW = 0,
            hAcc = 0;
          let wDom = 0,
            biomaDom = null,
            w2 = 0,
            bioma2 = null,
            wMax = 0;
          for (let k = 0; k < PEGADAS.length; k++) {
            const R = PEGADAS[k];
            const du = (u - R.u) / R.rx,
              dv = (v - R.v) / R.ry;
            const w = Math.exp(-(du * du + dv * dv) * 1.9);
            if (w > wMax) wMax = w;
            if (w < 0.03) continue;
            somaW += w;
            hAcc += w * alturaBioma(R.bioma, u, v);
            if (w > wDom) {
              w2 = wDom;
              bioma2 = biomaDom;
              wDom = w;
              biomaDom = R.bioma;
            } else if (w > w2) {
              w2 = w;
              bioma2 = R.bioma;
            }
          }
          // nenhuma região reivindica este ponto, mas a placa continental sustenta o solo
          terra = Math.max(terra, Math.min(0.92, wMax * 1.05) * borda);

          // mar / névoa rasa (faces de mar nem são desenhadas: o vazio estrelado aparece)
          if (terra <= 0.26) {
            out.h = BASE_Y + 2 + fbm(u * 5, v * 5) * 0.5;
            out.r = 13;
            out.g = 20;
            out.b = 36;
            out.e = 0;
            out.er = out.eg = out.eb = 0;
            out.mar = 1;
            return;
          }
          out.mar = 0;

          let h = (somaW > 0 ? hAcc / somaW : 6) + 10 * iA + 8 * iB;

          // trincheira alongada da Grande Fenda Central (estreita e profunda)
          const gf = (x, y, cx, cy, rx, ry) => {
            const a = (x - cx) / rx,
              b = (y - cy) / ry;
            return Math.exp(-(a * a + b * b) * 2.4);
          };
          const wFenda = gf(u, v, 0.5, 0.42, 0.08, 0.19);
          const wAbismo = gf(u, v, 0.52, 0.575, 0.105, 0.105);
          h -= 12 * wFenda;

          // cratera cósmica do Abismo (poço distinto, ao sul da fenda)
          h -= 34 * wAbismo;

          // caldeira selada do Fosso Infernal (depressão basáltica no extremo sul)
          if (CALDEIRA) h -= 11 * gf(u, v, CALDEIRA.u, CALDEIRA.v, 0.085, 0.075);

          // cones vulcânicos (com cratera no topo); guardam influência p/ recolorir
          let infVolc = 0;
          for (let k = 0; k < VOLCOES.length; k++) {
            const vc = VOLCOES[k];
            const d = Math.hypot(u - vc.u, v - vc.v);
            if (d < vc.r) {
              const t = 1 - d / vc.r,
                cone = t * t * (3 - 2 * t);
              h += vc.h * cone;
              infVolc = Math.max(infVolc, cone);
              if (d < vc.r * 0.18) {
                h -= vc.h * 0.5 * (1 - d / (vc.r * 0.18));
              } // cratera
            }
          }
          if (infVolc > 0.35) biomaDom = "Planalto Vulcânico"; // encostas vulcânicas rubras

          h = clamp(h, BASE_Y - 12, 52);

          if (wAbismo > 0.1) biomaDom = "Fenda Cósmica"; // recoloriza o fundo e as bordas da cratera

          // cor do bioma dominante, mesclando com o secundário nas transições
          const A = BIOMAS[biomaDom] || BIOMAS["Zona Temperada"];
          const B = BIOMAS[bioma2] || A;
          const tVar = 0.5 + 0.5 * fbm(u * 5.5 + 11.7, v * 5.5 + 5.3);
          const kMix = clamp(tVar, 0, 1) * (wDom / (wDom + w2 || 1));
          let r = lerp(A.a[0], A.b[0], kMix),
            g = lerp(A.a[1], A.b[1], kMix),
            b = lerp(A.a[2], A.b[2], kMix);

          // neve nos cumes mais altos
          if (biomaDom === "Montanhas de Dente de Dragão" && h > 33) {
            const ns = clamp((h - 33) / 9, 0, 1) * 0.85;
            r = lerp(r, 222, ns);
            g = lerp(g, 234, ns);
            b = lerp(b, 244, ns);
          }
          // litoral rochoso
          if (terra < 0.34) {
            const es = sstep(0.34, 0.26, terra) * 0.55;
            r = lerp(r, 92, es);
            g = lerp(g, 100, es);
            b = lerp(b, 112, es);
          }

          out.h = h;
          out.r = r;
          out.g = g;
          out.b = b;
          out.e = 0;
          out.er = r;
          out.eg = g;
          out.eb = b;

          // candidatos a fissura de lava (a coerência por vizinho vem em construirTerreno):
          // faixa larga do cruzamento zero do fbm -> linhas conectadas, sem "confete"
          if (
            (biomaDom === "Planalto Vulcânico" || biomaDom === "Transição Selva-Deserto") &&
            h > 6 &&
            Math.abs(fbm(u * 6.5 + 3.1, v * 6.5 + 9.4)) < 0.1
          ) {
            out.e = 1;
            out.er = 255;
            out.eg = 164;
            out.eb = 72;
          }
          // veios cintilantes do Abismo (mesma gramática de fissura conectada)
          if (
            biomaDom === "Fenda Cósmica" &&
            h < -8 &&
            Math.abs(fbm(u * 6.1 + 13.7, v * 6.1 + 5.1)) < 0.1
          ) {
            out.e = 1;
            out.er = 127;
            out.eg = 212;
            out.eb = 255;
          }
        }

        function alturaEm(u, v) {
          const x = clamp(u, 0, 1) * COLS,
            z = clamp(v, 0, 1) * ROWS;
          const x0 = clamp(Math.floor(x), 0, COLS - 1),
            z0 = clamp(Math.floor(z), 0, ROWS - 1);
          const fx = x - x0,
            fz = z - z0;
          const a = H[vidar(x0, z0)],
            b = H[vidar(x0 + 1, z0)],
            c = H[vidar(x0, z0 + 1)],
            d = H[vidar(x0 + 1, z0 + 1)];
          return lerp(lerp(a, b, fx), lerp(c, d, fx), fz);
        }

        /* ---- quads do terreno + paredões laterais (placa extrudada) ---- */
        const NUM_CELULAS = COLS * ROWS;
        const Q_IDX = new Int32Array(NUM_CELULAS * 4);
        const Q_COR = new Float32Array(NUM_CELULAS * 3);
        const Q_EMISSIVO = new Uint8Array(NUM_CELULAS);
        const Q_GLOW = new Uint8Array(NUM_CELULAS); // 1 = núcleo de fissura (≥2 vizinhos emissivos)
        const Q_EMCOR = new Float32Array(NUM_CELULAS * 3);
        const Q_MAR = new Uint8Array(NUM_CELULAS); // 1 = face de mar (pular)

        const PAREDES = []; // {va,vb,vc,vd (vértices topo), y0 (base), cor:[r,g,b], nx,nz (normal)}

        function construirQuads() {
          for (let j = 0; j < ROWS; j++) {
            for (let i = 0; i < COLS; i++) {
              const q = j * COLS + i,
                b = q * 4;
              Q_IDX[b] = vidar(i, j);
              Q_IDX[b + 1] = vidar(i + 1, j);
              Q_IDX[b + 2] = vidar(i + 1, j + 1);
              Q_IDX[b + 3] = vidar(i, j + 1);
              // cor da face = média dos cantos; emissivo só com ≥2 cantos na fissura
              // ( faces raspadas por um canto único engordariam a linha em manchas )
              let r = 0,
                g = 0,
                bl = 0,
                nE = 0,
                mar = 0;
              for (let c = 0; c < 4; c++) {
                const vi = Q_IDX[b + c];
                r += CORV[vi * 3];
                g += CORV[vi * 3 + 1];
                bl += CORV[vi * 3 + 2];
                if (EMISV[vi]) {
                  nE++;
                }
                if (MARV[vi]) {
                  mar++;
                }
              }
              Q_COR[q * 3] = r / 4;
              Q_COR[q * 3 + 1] = g / 4;
              Q_COR[q * 3 + 2] = bl / 4;
              Q_EMISSIVO[q] = nE >= 2 ? 1 : 0;
              Q_MAR[q] = mar === 4 ? 1 : 0;
              if (Q_EMISSIVO[q]) {
                let er = 0,
                  eg = 0,
                  eb = 0,
                  n = 0;
                for (let c = 0; c < 4; c++) {
                  const vi = Q_IDX[b + c];
                  if (EMISV[vi]) {
                    er += EMCOR[vi * 3];
                    eg += EMCOR[vi * 3 + 1];
                    eb += EMCOR[vi * 3 + 2];
                    n++;
                  }
                }
                Q_EMCOR[q * 3] = er / n;
                Q_EMCOR[q * 3 + 1] = eg / n;
                Q_EMCOR[q * 3 + 2] = eb / n;
              }
            }
          }
          // o glow fica restrito ao esqueleto das fissuras (≥2 vizinhas emissivas):
          // linhas ganham um halo contínuo em vez de brilho por célula solta
          for (let j = 0; j < ROWS; j++) {
            for (let i = 0; i < COLS; i++) {
              const q = j * COLS + i;
              if (!Q_EMISSIVO[q]) continue;
              let viz = 0;
              if (i > 0 && Q_EMISSIVO[q - 1]) viz++;
              if (i < COLS - 1 && Q_EMISSIVO[q + 1]) viz++;
              if (j > 0 && Q_EMISSIVO[q - COLS]) viz++;
              if (j < ROWS - 1 && Q_EMISSIVO[q + COLS]) viz++;
              Q_GLOW[q] = viz >= 2 ? 1 : 0;
            }
          }
          // paredões: onde a vizinhança é mais baixa (ou na borda do mapa),
          // desce uma parede até a base -> continente "extrudado" na névoa
          const ALT_MEDIA = (i, j) =>
            (H[vidar(i, j)] +
              H[vidar(i, Math.min(j + 1, ROWS))] +
              H[vidar(Math.min(i + 1, COLS), j)]) /
            3;
          const COR_MEDIA = (i, j, out) => {
            const vi = vidar(clamp(i, 0, COLS), clamp(j, 0, ROWS));
            out[0] = CORV[vi * 3];
            out[1] = CORV[vi * 3 + 1];
            out[2] = CORV[vi * 3 + 2];
          };
          const cm = [0, 0, 0];
          const parede = (ia, ja, ib, jb, nx, nz, oi, oj) => {
            const va = vidar(ia, ja),
              vb = vidar(ib, jb);
            COR_MEDIA(oi, oj, cm); // cor vem do lado mais alto (dono do penhasco)
            PAREDES.push({
              va,
              vb,
              y0: BASE_Y,
              nx,
              nz,
              cor: [cm[0] * 0.5, cm[1] * 0.5, cm[2] * 0.5]
            });
          };
          for (let j = 0; j < ROWS; j++) {
            for (let i = 0; i < COLS; i++) {
              const hC = ALT_MEDIA(i, j);
              // borda leste: paredão em qualquer descontinuidade (face voltada p/ o lado baixo)
              if (i < COLS - 1) {
                const hd = hC - ALT_MEDIA(i + 1, j);
                if (hd > 1.2) parede(i + 1, j, i + 1, j + 1, 1, 0, i, j);
                else if (hd < -1.2) parede(i + 1, j, i + 1, j + 1, -1, 0, i + 1, j);
              } else if (hC > BASE_Y + 4) {
                parede(i + 1, j, i + 1, j + 1, 1, 0, i, j); // borda leste do mapa (só onde há terra)
              }
              // borda sul da célula
              if (j < ROWS - 1) {
                const hd = hC - ALT_MEDIA(i, j + 1);
                if (hd > 1.2) parede(i, j + 1, i + 1, j + 1, 0, 1, i, j);
                else if (hd < -1.2) parede(i, j + 1, i + 1, j + 1, 0, -1, i, j + 1);
              } else if (hC > BASE_Y + 4) {
                parede(i, j + 1, i + 1, j + 1, 0, 1, i, j); // borda sul do mapa (só onde há terra)
              }
              // bordas norte e oeste do mapa inteiro (idem: só onde há terra)
              if (j === 0 && hC > BASE_Y + 4) parede(i, 0, i + 1, 0, 0, -1, i, 0);
              if (i === 0 && hC > BASE_Y + 4) parede(0, j, 0, j + 1, -1, 0, 0, j);
            }
          }
        }

        /* ============================================================
   4. RENDERIZAÇÃO — pintor, sombreamento flat, névoa, pins
   ============================================================ */

        const canvas = document.getElementById("mapa");
        const ctx = canvas.getContext("2d");
        let larguraTela = 0,
          alturaTela = 0,
          dpr = 1;
        let fundoEstrelas = null;

        const LUZ = (() => {
          const x = -0.5,
            y = 0.9,
            z = -0.35,
            l = Math.hypot(x, y, z);
          return { x: x / l, y: y / l, z: z / l };
        })();
        const AMBIENTE = 0.46,
          DIFUSA = 0.6;
        // cor da névoa = cor do fundo no centro -> as bordas do continente se dissolvem
        const NEB_FONTE = [13, 20, 36],
          NEB_PERTO = 330,
          NEB_LONGE = 1250,
          NEB_MAX = 0.86;

        // buffers reutilizados (sem alocação pesada por quadro)
        // limite superior de itens: células + paredes (≤ 2 por célula + bordas) + pins
        const SX = new Float32Array(VX * VZ),
          SY = new Float32Array(VX * VZ),
          SZ = new Float32Array(VX * VZ);
        const MAX_ITENS = NUM_CELULAS * 4 + 96; // células + paredes + folga para os pins
        const ORDEM = new Array(MAX_ITENS);
        let nItens = 0;
        const PROF = new Float32Array(MAX_ITENS);
        const PIN_ORDEM = new Array(48); // ordem de desenho dos pins (entre si)
        let nPinos = 0;
        const _cacheCor = new Map();

        function cssCor(r, g, b) {
          const ri = Math.min(255, r) | 0,
            gi = Math.min(255, g) | 0,
            bi = Math.min(255, b) | 0;
          const k = (ri << 16) | (gi << 8) | bi;
          let s = _cacheCor.get(k);
          if (!s) {
            s = "rgb(" + ri + "," + gi + "," + bi + ")";
            _cacheCor.set(k, s);
          }
          return s;
        }

        function redimensionar() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          larguraTela = canvas.clientWidth;
          alturaTela = canvas.clientHeight;
          canvas.width = Math.round(larguraTela * dpr);
          canvas.height = Math.round(alturaTela * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          focal = alturaTela / 2 / Math.tan((27 * Math.PI) / 180); // FOV vertical ~54°
          gerarEstrelas();
        }

        // céu estrelado pré-renderizado (barato de desenhar por quadro)
        function gerarEstrelas() {
          fundoEstrelas = document.createElement("canvas");
          fundoEstrelas.width = canvas.width;
          fundoEstrelas.height = canvas.height;
          const c2 = fundoEstrelas.getContext("2d");
          c2.scale(dpr, dpr);
          let semente = 7;
          const rnd = () => {
            semente = (semente * 16807) % 2147483647;
            return semente / 2147483647;
          };
          for (let n = 0; n < 170; n++) {
            const x = rnd() * larguraTela,
              y = rnd() * alturaTela;
            const r = 0.4 + rnd() * 1.1,
              a = 0.25 + rnd() * 0.6;
            const tinte = rnd();
            let corEstrela = "rgba(220,228,245," + a + ")";
            if (tinte > 0.92)
              corEstrela = "rgba(201,162,39," + a + ")"; // douradas raras
            else if (tinte > 0.84) corEstrela = "rgba(127,212,255," + a + ")"; // azuladas
            c2.fillStyle = corEstrela;
            c2.beginPath();
            c2.arc(x, y, r, 0, 6.2832);
            c2.fill();
          }
        }

        // wisps de névoa que derivam ao redor do continente
        const NEBLINHAS = [];
        for (let n = 0; n < 6; n++) {
          NEBLINHAS.push({
            ang: n * 1.047 + n * n * 0.61,
            raio: 210 + n * 26,
            vel: (n % 2 ? 0.000045 : -0.000038) * (1 + n * 0.12),
            tam: 95 + n * 17,
            alfa: 0.045 + 0.012 * (n % 3),
            frente: n >= 4
          });
        }

        function projetarGrade() {
          for (let j = 0; j < VZ; j++) {
            for (let i = 0; i < VX; i++) {
              const vi = vidar(i, j);
              if (projetar(WX[i], H[vi], WZ[j])) {
                SX[vi] = proj.x;
                SY[vi] = proj.y;
                SZ[vi] = proj.z;
              } else {
                SZ[vi] = -1;
              }
            }
          }
        }

        function sombraQuadro(qIdx) {
          // intensidade emissiva com leve tremulação (viva, não estática)
          if (RM) return 1.02;
          return 1.0 + 0.09 * Math.sin(tempoAgora * 0.0026 + qIdx * 1.7);
        }

        function desenharCelula(q) {
          if (Q_MAR[q]) return; // mar: deixa o vazio estrelado aparecer
          const b = q * 4;
          const v0 = Q_IDX[b],
            v1 = Q_IDX[b + 1],
            v2 = Q_IDX[b + 2],
            v3 = Q_IDX[b + 3];
          // se qualquer canto caiu atrás do plano próximo, descarta (evita triângulo degenerado)
          if (SZ[v0] < 0 || SZ[v1] < 0 || SZ[v2] < 0 || SZ[v3] < 0) return;
          // culling: todos fora da tela (com margem) -> pula
          const m = 120;
          if (
            (SX[v0] < -m && SX[v1] < -m && SX[v2] < -m && SX[v3] < -m) ||
            (SX[v0] > larguraTela + m &&
              SX[v1] > larguraTela + m &&
              SX[v2] > larguraTela + m &&
              SX[v3] > larguraTela + m) ||
            (SY[v0] < -m && SY[v1] < -m && SY[v2] < -m && SY[v3] < -m) ||
            (SY[v0] > alturaTela + m &&
              SY[v1] > alturaTela + m &&
              SY[v2] > alturaTela + m &&
              SY[v3] > alturaTela + m)
          )
            return;
          const prof = (SZ[v0] + SZ[v1] + SZ[v2] + SZ[v3]) * 0.25;

          // normal flat a partir dos cantos em coordenadas de mundo
          const i0 = v0 % VX,
            j0 = (v0 - i0) / VX;
          const x00 = WX[i0],
            z00 = WZ[j0],
            y00 = H[v0];
          const i1 = v1 % VX,
            j1 = (v1 - i1) / VX;
          const x10 = WX[i1],
            z10 = WZ[j1],
            y10 = H[v1];
          const i3 = v3 % VX,
            j3 = (v3 - i3) / VX;
          const x01 = WX[i3],
            z01 = WZ[j3],
            y01 = H[v3];
          let nx = (y10 - y00) * (z01 - z00) - (z10 - z00) * (y01 - y00);
          let ny = (z10 - z00) * (x01 - x00) - (x10 - x00) * (z01 - z00);
          let nz = (x10 - x00) * (y01 - y00) - (y10 - y00) * (x01 - x00);
          const nl = Math.hypot(nx, ny, nz) || 1;
          nx /= nl;
          ny /= nl;
          nz /= nl;
          if (ny < 0) {
            nx = -nx;
            ny = -ny;
            nz = -nz;
          }
          const lambert = Math.max(0, nx * LUZ.x + ny * LUZ.y + nz * LUZ.z);

          const profNeb = clamp((prof - NEB_PERTO) / (NEB_LONGE - NEB_PERTO), 0, 1);
          const neb =
            Math.pow(profNeb, 1.15) * NEB_MAX + clamp((BASE_Y + 4 - y00) / 90, 0, 1) * 0.12;

          let rr, gg, bb;
          if (Q_EMISSIVO[q]) {
            const kq = sombraQuadro(q);
            rr = Q_EMCOR[q * 3] * kq;
            gg = Q_EMCOR[q * 3 + 1] * kq;
            bb = Q_EMCOR[q * 3 + 2] * kq;
          } else {
            const sombra = Math.min(1, AMBIENTE + DIFUSA * lambert);
            rr = Q_COR[q * 3] * sombra;
            gg = Q_COR[q * 3 + 1] * sombra;
            bb = Q_COR[q * 3 + 2] * sombra;
          }
          rr += (NEB_FONTE[0] - rr) * neb;
          gg += (NEB_FONTE[1] - gg) * neb;
          bb += (NEB_FONTE[2] - bb) * neb;

          const cor = cssCor(rr, gg, bb);
          ctx.fillStyle = cor;
          ctx.strokeStyle = cor;
          ctx.lineWidth = 1;
          // leve expansão em torno do centro fecha as frestas entre quads
          const cxp = (SX[v0] + SX[v1] + SX[v2] + SX[v3]) * 0.25,
            cyp = (SY[v0] + SY[v1] + SY[v2] + SY[v3]) * 0.25;
          ctx.beginPath();
          ctx.moveTo(cxp + (SX[v0] - cxp) * 1.018, cyp + (SY[v0] - cyp) * 1.018);
          ctx.lineTo(cxp + (SX[v1] - cxp) * 1.018, cyp + (SY[v1] - cyp) * 1.018);
          ctx.lineTo(cxp + (SX[v2] - cxp) * 1.018, cyp + (SY[v2] - cyp) * 1.018);
          ctx.lineTo(cxp + (SX[v3] - cxp) * 1.018, cyp + (SY[v3] - cyp) * 1.018);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          if (Q_EMISSIVO[q] && Q_GLOW[q]) {
            const area =
              Math.abs(
                (SX[v1] - SX[v0]) * (SY[v3] - SY[v0]) - (SX[v3] - SX[v0]) * (SY[v1] - SY[v0])
              ) * 0.5;
            if (area > 14) {
              // gate baixo: halo vive também na vista geral
              ctx.save();
              ctx.globalCompositeOperation = "lighter";
              ctx.globalAlpha = 0.26;
              ctx.shadowColor = cssCor(Q_EMCOR[q * 3], Q_EMCOR[q * 3 + 1], Q_EMCOR[q * 3 + 2]);
              ctx.shadowBlur = clamp(area * 0.07, 12, 34);
              ctx.fillStyle = cssCor(rr, gg, bb);
              ctx.fill();
              ctx.restore();
            }
          }
        }

        // pequeno auxiliar: teto de segurança para componentes de cor
        function tetoCor(v) {
          return v > 255 ? 255 : v;
        }

        function desenharParede(idx) {
          const p = PAREDES[idx];
          if (SZ[p.va] < 0 || SZ[p.vb] < 0) return;
          // canto A: topo (vértice da grade) e base (mesmo x/z, y = base da placa)
          if (!projetar(WX[p.va % VX], p.y0, WZ[Math.floor(p.va / VX)])) return;
          const xa = proj.x,
            ya = proj.y,
            za = proj.z;
          const xt = SX[p.va],
            yt = SY[p.va];
          // canto B
          if (!projetar(WX[p.vb % VX], p.y0, WZ[Math.floor(p.vb / VX)])) return;
          const xb = proj.x,
            yb = proj.y,
            zb = proj.z;
          const xt2 = SX[p.vb],
            yt2 = SY[p.vb];
          // culling por tela
          const m = 140;
          if (
            Math.max(xa, xt, xb, xt2) < -m ||
            Math.min(xa, xt, xb, xt2) > larguraTela + m ||
            Math.max(ya, yt, yb, yt2) < -m ||
            Math.min(ya, yt, yb, yt2) > alturaTela + m
          )
            return;
          const prof = (za + zb) * 0.5;

          const lambert = Math.max(0, p.nx * LUZ.x + p.nz * LUZ.z + 0.15);
          const sombra = Math.min(1, AMBIENTE * 0.9 + DIFUSA * 0.7 * lambert);
          const profNeb = clamp((prof - NEB_PERTO) / (NEB_LONGE - NEB_PERTO), 0, 1);
          const neb = Math.pow(profNeb, 1.15) * NEB_MAX;
          let rr = p.cor[0] * sombra,
            gg = p.cor[1] * sombra,
            bb = p.cor[2] * sombra;
          rr += (NEB_FONTE[0] - rr) * neb;
          gg += (NEB_FONTE[1] - gg) * neb;
          bb += (NEB_FONTE[2] - bb) * neb;

          const cor = cssCor(tetoCor(rr), tetoCor(gg), tetoCor(bb));
          ctx.fillStyle = cor;
          ctx.strokeStyle = cor;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(xt, yt);
          ctx.lineTo(xt2, yt2);
          ctx.lineTo(xb, yb);
          ctx.lineTo(xa, ya);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }

        /* ---- pins (marcadores billboard) ---- */
        const PINOS = [];
        function construirPinos() {
          for (let k = 0; k < POIS.length; k++) {
            const p = POIS[k];
            const wx = (p.u - 0.5) * MAP_W,
              wz = (p.v - 0.5) * MAP_D;
            const solo = alturaEm(p.u, p.v);
            PINOS.push({
              poi: p,
              wx,
              wz,
              solo,
              alt: p.tipo === "ceu" ? p.alt : 0,
              fase: k * 1.93,
              visivel: true,
              tx: 0,
              ty: 0,
              tam: 10,
              prof: 1e9, // estado de tela do quadro
              bx: 0,
              by: 0 // projeção da base (solo)
            });
          }
        }

        const ALT_HASTE = 26; // altura (em unidades de mundo) da haste dos pins terrestres

        // ============================================================
        // W5.1: MINIMAP — bússola 2D no canto inferior direito
        // ============================================================
        const MM_W = 160;
        const MM_H = 180;
        const mmCanvas = document.getElementById("minimapCanvas");
        const mmCtx = mmCanvas && mmCanvas.getContext("2d");

        // helpers de conversão mundo (MAP_W × MAP_D) → minimap (MM_W × MM_H)
        function mundoParaMM(wx, wz) {
          return {
            x: (wx / MAP_W + 0.5) * MM_W,
            y: (wz / MAP_D + 0.5) * MM_H
          };
        }

        // Retângulo visível da viewport no minimap.
        // Como a câmera é orbital com centro (cam.tx, cam.tz) e dist, o que aparece
        // na viewport é um quadrado proporcional a cam.dist, rotacionado por cam.yaw.
        function retanguloVisivel() {
          // fator de "metade da viewport visível em unidades de mundo"
          // derivação: a tela tem larguraTela px com focal ~ 500; a área que cabe
          // em zv ~ cam.dist tem tamanho mundo ~= (larguraTela/2) * (cam.dist/focal).
          const focalUsado = 500;
          const meioLargura = (larguraTela / 2) * (cam.dist / focalUsado);
          // correção: mapa é mais largo em z (MAP_D > MAP_W), o que importa é a meia-largura
          // em cada eixo (assume aspect ratio similar; suficiente p/ bússola)
          const centro = mundoParaMM(cam.tx, cam.tz);
          // retângulo rotacionado por cam.yaw
          const c = Math.cos(cam.yaw);
          const s = Math.sin(cam.yaw);
          const rx = meioLargura * (MM_W / MAP_W);
          const ry = meioLargura * (MM_H / MAP_D);
          const corners = [
            [-rx, -ry],
            [rx, -ry],
            [rx, ry],
            [-rx, ry]
          ].map(([x, y]) => ({
            x: centro.x + x * c - y * s,
            y: centro.y + x * s + y * c
          }));
          return corners;
        }

        function desenharMinimap() {
          if (!mmCtx) return;
          mmCtx.clearRect(0, 0, MM_W, MM_H);
          // fundo escuro com leve gradiente
          const grad = mmCtx.createLinearGradient(0, 0, 0, MM_H);
          grad.addColorStop(0, "#0a1426");
          grad.addColorStop(1, "#1a120e");
          mmCtx.fillStyle = grad;
          mmCtx.fillRect(0, 0, MM_W, MM_H);
          // borda interna decorativa
          mmCtx.strokeStyle = "rgba(201,162,39,0.15)";
          mmCtx.lineWidth = 1;
          mmCtx.strokeRect(0.5, 0.5, MM_W - 1, MM_H - 1);
          // pins (mini-dots, invisíveis somem)
          for (let k = 0; k < PINOS.length; k++) {
            const pn = PINOS[k];
            if (!pn.visivel) continue;
            const p = mundoParaMM(pn.wx, pn.wz);
            if (p.x < 0 || p.x >= MM_W || p.y < 0 || p.y >= MM_H) continue;
            // cor por tipo
            const cor =
              pn.poi.tipo === "regiao"
                ? "#C9A227"
                : pn.poi.tipo === "batalha"
                  ? "#E2483D"
                  : "#7EC0EE";
            mmCtx.fillStyle = cor;
            mmCtx.beginPath();
            mmCtx.arc(p.x, p.y, 1.6, 0, Math.PI * 2);
            mmCtx.fill();
          }
          // retângulo da vista (bússola)
          const corners = retanguloVisivel();
          mmCtx.beginPath();
          mmCtx.moveTo(corners[0].x, corners[0].y);
          for (let i = 1; i < corners.length; i++) mmCtx.lineTo(corners[i].x, corners[i].y);
          mmCtx.closePath();
          mmCtx.strokeStyle = "#faf8f3";
          mmCtx.lineWidth = 1.5;
          mmCtx.stroke();
          // ponto central (foco da câmera)
          const centro = mundoParaMM(cam.tx, cam.tz);
          mmCtx.fillStyle = "#faf8f3";
          mmCtx.beginPath();
          mmCtx.arc(centro.x, centro.y, 2, 0, Math.PI * 2);
          mmCtx.fill();
        }

        // Click no minimap = teleporta a câmera para o ponto clicado
        if (mmCanvas) {
          mmCanvas.addEventListener("click", (ev) => {
            const rect = mmCanvas.getBoundingClientRect();
            const mx = (ev.clientX - rect.left) / rect.width;
            const my = (ev.clientY - rect.top) / rect.height;
            const alvoX = (mx - 0.5) * MAP_W;
            const alvoZ = (my - 0.5) * MAP_D;
            // teletransporta com tween suave
            if (typeof iniciarTween === "function") {
              iniciarTween({ tx: alvoX, tz: alvoZ, dist: cam.dist }, 380);
            } else {
              cam.tx = alvoX;
              cam.tz = alvoZ;
            }
          });
        }

        function atualizarPinos(agora) {
          for (let k = 0; k < PINOS.length; k++) {
            const pn = PINOS[k];
            const camadaOk =
              CAMADAS[
                pn.poi.tipo === "regiao"
                  ? "regioes"
                  : pn.poi.tipo === "batalha"
                    ? "batalhas"
                    : "ceus"
              ];
            // Filtro de raça (W5.3): se FILTRO_RACA setado, exige match em poi.racas.
            // Ceus/batalhas podem ter racas vazias — somem quando filtro ativo.
            const racaOk =
              !FILTRO_RACA ||
              (Array.isArray(pn.poi.racas) && pn.poi.racas.some((r) => r.folder === FILTRO_RACA));
            // §6.3 — Filtro de era: se FILTRO_ERA setado, esconde battles que não batem.
            // Regiões e céus NÃO são afetados (filtro só esconde battles, evita "mapa vazio").
            const eraOk = !FILTRO_ERA || pn.poi.tipo !== "batalha" || pn.poi.era === FILTRO_ERA;
            pn.visivel = false;
            pn.prof = 1e9;
            if (!camadaOk) continue;
            if (!racaOk) continue;
            if (!eraOk) continue;
            const bob = pn.poi.tipo === "ceu" && !RM ? Math.sin(agora * 0.0011 + pn.fase) * 4 : 0;
            const ySolo = pn.solo;
            const yAlto = ySolo + (pn.poi.tipo === "ceu" ? pn.alt + bob : ALT_HASTE);
            if (!projetar(pn.wx, ySolo, pn.wz)) continue;
            pn.bx = proj.x;
            pn.by = proj.y;
            const profBase = proj.z;
            if (!projetar(pn.wx, yAlto, pn.wz)) continue;
            pn.tx = proj.x;
            pn.ty = proj.y;
            pn.prof = proj.z;
            let tam = ((pn.poi.tipo === "ceu" ? 10.5 : 9) * focal) / proj.z;
            tam = clamp(tam, 9, 36);
            if (hoverPino === pn || selecionado === pn.poi.id)
              tam *= 1 + 0.13 * Math.sin(agora * 0.006 + pn.fase);
            pn.tam = tam;
            pn.visivel =
              pn.tx > -60 &&
              pn.tx < larguraTela + 60 &&
              pn.by > -80 &&
              pn.by < alturaTela + 80 &&
              profBase > PLANO_PROX + 20;
          }
        }

        const HEXA = {};
        function hexRgb(h) {
          let c = HEXA[h];
          if (!c) {
            c = [
              parseInt(h.slice(1, 3), 16),
              parseInt(h.slice(3, 5), 16),
              parseInt(h.slice(5, 7), 16)
            ];
            HEXA[h] = c;
          }
          return c;
        }
        function rgba(hex, a) {
          const c = hexRgb(hex);
          return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
        }

        function desenharPino(pn, agora) {
          const p = pn.poi,
            s = pn.tam;
          const cor = p.cor;

          if (p.tipo === "ceu") {
            // feixe tênue descendo até o solo
            const grad = ctx.createLinearGradient(pn.bx, pn.by, pn.tx, pn.ty);
            grad.addColorStop(0, rgba(cor, 0));
            grad.addColorStop(1, rgba(cor, 0.28));
            ctx.strokeStyle = grad;
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(pn.bx, pn.by);
            ctx.lineTo(pn.tx, pn.ty);
            ctx.stroke();

            ctx.save();
            ctx.shadowColor = rgba(cor, 0.9);
            ctx.shadowBlur = s * 1.9;
            // halo: anel + núcleo
            ctx.strokeStyle = rgba(cor, 0.95);
            ctx.lineWidth = Math.max(1.6, s * 0.2);
            ctx.beginPath();
            ctx.arc(pn.tx, pn.ty, s * 1.12, 0, 6.2832);
            ctx.stroke();
            ctx.fillStyle = rgba("#FFFFFF", 0.9);
            ctx.beginPath();
            ctx.arc(pn.tx, pn.ty, Math.max(1.6, s * 0.3), 0, 6.2832);
            ctx.fill();
            ctx.restore();
            if (!RM) {
              // faísca orbital
              const ang = agora * 0.0016 + pn.fase;
              const ox = pn.tx + Math.cos(ang) * s * 1.12,
                oy = pn.ty + Math.sin(ang) * s * 1.12;
              ctx.fillStyle = rgba(cor, 0.85);
              ctx.beginPath();
              ctx.arc(ox, oy, 1.7, 0, 6.2832);
              ctx.fill();
            }
          } else {
            // anel de assentamento no solo (achatado pela perspectiva)
            const ry = Math.max(1.5, s * 0.8 * Math.sin(cam.pitch));
            ctx.strokeStyle = rgba(cor, 0.5);
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.ellipse(pn.bx, pn.by, s * 0.8, ry, 0, 0, 6.2832);
            ctx.stroke();

            // haste luminosa
            ctx.strokeStyle = rgba(cor, 0.85);
            ctx.lineWidth = Math.max(1.1, s * 0.1);
            ctx.beginPath();
            ctx.moveTo(pn.bx, pn.by);
            ctx.lineTo(pn.tx, pn.ty + s * 0.9);
            ctx.stroke();

            ctx.save();
            ctx.shadowColor = rgba(cor, 0.85);
            ctx.shadowBlur = s * 1.5;
            if (p.tipo === "batalha") {
              // espadas cruzadas: X com guarda
              ctx.strokeStyle = rgba(cor, 1);
              ctx.lineWidth = Math.max(1.6, s * 0.26);
              ctx.lineCap = "round";
              const L = s * 0.85;
              ctx.beginPath();
              ctx.moveTo(pn.tx - L, pn.ty - L);
              ctx.lineTo(pn.tx + L, pn.ty + L);
              ctx.moveTo(pn.tx + L, pn.ty - L);
              ctx.lineTo(pn.tx - L, pn.ty + L);
              ctx.stroke();
              ctx.lineWidth = Math.max(1, s * 0.14);
              const g = L * 0.62;
              ctx.beginPath();
              ctx.moveTo(pn.tx - g * 0.8, pn.ty - g * 1.25);
              ctx.lineTo(pn.tx + g * 0.8, pn.ty + g * 1.25);
              ctx.moveTo(pn.tx + g * 1.25, pn.ty - g * 0.8);
              ctx.lineTo(pn.tx - g * 1.25, pn.ty + g * 0.8);
              ctx.stroke();
              ctx.fillStyle = rgba("#FFD9D4", 0.95);
              ctx.beginPath();
              ctx.arc(pn.tx, pn.ty, Math.max(1.4, s * 0.16), 0, 6.2832);
              ctx.fill();
            } else {
              // gema losangular da região
              ctx.fillStyle = rgba(cor, 0.98);
              ctx.beginPath();
              ctx.moveTo(pn.tx, pn.ty - s);
              ctx.lineTo(pn.tx + s * 0.72, pn.ty);
              ctx.lineTo(pn.tx, pn.ty + s);
              ctx.lineTo(pn.tx - s * 0.72, pn.ty);
              ctx.closePath();
              ctx.fill();
              ctx.strokeStyle = rgba("#FFFFFF", 0.4);
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(pn.tx, pn.ty - s * 0.55);
              ctx.lineTo(pn.tx, pn.ty + s * 0.55);
              ctx.stroke();
            }
            ctx.restore();

            // marca de seleção
            if (selecionado === p.id) {
              const pr = s * (1.7 + 0.3 * Math.sin(agora * 0.004));
              ctx.strokeStyle = rgba("#C9A227", 0.85);
              ctx.lineWidth = 1.6;
              ctx.beginPath();
              ctx.arc(pn.tx, pn.ty, pr, 0, 6.2832);
              ctx.stroke();
            }
          }
        }

        function desenharNeblinha(n, agora) {
          const ang = n.ang + agora * n.vel;
          const px = Math.cos(ang) * n.raio,
            pz = Math.sin(ang) * n.raio;
          if (!projetar(px, -16, pz)) return;
          const r = (n.tam * focal) / proj.z;
          const g = ctx.createRadialGradient(proj.x, proj.y, 0, proj.x, proj.y, r);
          g.addColorStop(0, "rgba(120,140,190," + n.alfa + ")");
          g.addColorStop(1, "rgba(120,140,190,0)");
          ctx.fillStyle = g;
          ctx.fillRect(proj.x - r, proj.y - r, r * 2, r * 2);
        }

        let tempoAgora = 0;
        let tempoQuadroMedio = 4,
          _ultimoT = 0;

        function quadro(agora) {
          tempoAgora = agora;
          _ultimoT = agora;
          const _iniRender = performance.now();

          passoTween(agora);
          atualizarCamera();

          ctx.clearRect(0, 0, larguraTela, alturaTela);

          // céu
          ctx.globalAlpha = RM ? 0.9 : 0.82 + 0.18 * Math.sin(agora * 0.0007);
          ctx.drawImage(fundoEstrelas, 0, 0, larguraTela, alturaTela);
          ctx.globalAlpha = 1;

          // névoa ao fundo
          for (let n = 0; n < NEBLINHAS.length; n++)
            if (!NEBLINHAS[n].frente) desenharNeblinha(NEBLINHAS[n], agora);

          projetarGrade();
          atualizarPinos(agora);

          // lista ordenável do terreno: células + paredes (algoritmo do pintor)
          nItens = 0;
          for (let q = 0; q < NUM_CELULAS; q++) {
            if (Q_MAR[q]) continue; // mar nem entra na ordenação
            const b = q * 4,
              v0 = Q_IDX[b],
              v1 = Q_IDX[b + 1],
              v2 = Q_IDX[b + 2],
              v3 = Q_IDX[b + 3];
            if (SZ[v0] < 0 && SZ[v1] < 0 && SZ[v2] < 0 && SZ[v3] < 0) continue;
            const prof = (SZ[v0] + SZ[v1] + SZ[v2] + SZ[v3]) * 0.25;
            if (prof <= PLANO_PROX) continue;
            PROF[nItens] = prof;
            ORDEM[nItens++] = q;
          }
          for (let w = 0; w < PAREDES.length; w++) {
            const p = PAREDES[w];
            if (SZ[p.va] < 0 || SZ[p.vb] < 0) continue;
            const prof = (SZ[p.va] + SZ[p.vb]) * 0.5;
            if (prof <= PLANO_PROX) continue;
            PROF[nItens] = prof;
            ORDEM[nItens++] = NUM_CELULAS + w;
          }
          // ordenação in-place (do mais distante para o mais próximo)
          ORDEM.length = nItens;
          ORDEM.sort((a, b) => PROF[b] - PROF[a]);

          for (let n = 0; n < nItens; n++) {
            const item = ORDEM[n];
            if (item < NUM_CELULAS) desenharCelula(item);
            else desenharParede(item - NUM_CELULAS);
          }

          // §6.2 — polilinha da rota narrativa (atrás dos pinos)
          if (typeof narrFrameHook === "function") narrFrameHook(agora);

          // pins em passada própria, por cima do terreno (marcadores sempre legíveis),
          // ordenados entre si por profundidade
          nPinos = 0;
          for (let k = 0; k < PINOS.length; k++) {
            const pn = PINOS[k];
            if (pn.visivel) PIN_ORDEM[nPinos++] = pn;
          }
          PIN_ORDEM.length = nPinos;
          PIN_ORDEM.sort((a, b) => b.prof - a.prof);
          for (let k = 0; k < nPinos; k++) desenharPino(PIN_ORDEM[k], agora);

          // névoa em primeiro plano (sensação de profundidade)
          for (let n = 0; n < NEBLINHAS.length; n++)
            if (NEBLINHAS[n].frente) desenharNeblinha(NEBLINHAS[n], agora);

          // tempo real de desenho (diagnóstico; exclui ociosidade entre quadros)
          tempoQuadroMedio = tempoQuadroMedio * 0.9 + (performance.now() - _iniRender) * 0.1;

          // W5.1: minimap
          desenharMinimap();

          requestAnimationFrame(quadro);
        }

        /* ============================================================
   5. INTERAÇÃO — orbitar, zoom, hover, clique, teclado
   ============================================================ */

        const CAMADAS = { regioes: true, batalhas: true, ceus: true };
        // Filtro de raça (W5.3). Vazio = todas. Restaurado do localStorage no boot.
        let FILTRO_RACA = "";
        try {
          FILTRO_RACA = localStorage.getItem("mapaFiltroRaca") || "";
        } catch (e) {}
        // §6.3 — Filtro de era (I-IV). Vazio = todas. Mesma persistência do filtro de raça.
        let FILTRO_ERA = "";
        try {
          FILTRO_ERA = localStorage.getItem("mapaFiltroEra") || "";
        } catch (e) {}
        let hoverPino = null;
        let selecionado = null;
        let arrastando = false,
          _downX = 0,
          _downY = 0,
          _downT = 0,
          _moveu = false;
        const ponteiros = new Map();
        let pinchDist0 = 0;

        function pinoEm(x, y) {
          // prioridade: pin mais "centrado" sob o cursor (distância normalizada pelo raio);
          // empates resolvidos pelo mais próximo da câmera
          let melhor = null,
            melhorNota = Infinity,
            melhorProf = Infinity;
          for (let k = 0; k < PINOS.length; k++) {
            const pn = PINOS[k];
            if (!pn.visivel) continue;
            const raio = Math.max(16, pn.tam * 1.2);
            const d1 = Math.hypot(x - pn.tx, y - pn.ty) / raio;
            const d2 = Math.hypot(x - pn.bx, y - pn.by) / (raio * 0.9);
            const d = Math.min(d1, d2);
            if (d <= 1 && (d < melhorNota || (d === melhorNota && pn.prof < melhorProf))) {
              melhorNota = d;
              melhorProf = pn.prof;
              melhor = pn;
            }
          }
          return melhor;
        }

        canvas.addEventListener("pointerdown", (e) => {
          try {
            canvas.setPointerCapture(e.pointerId);
          } catch (_) {}
          ponteiros.set(e.pointerId, { x: e.clientX, y: e.clientY });
          if (ponteiros.size === 1) {
            arrastando = true;
            _moveu = false;
            _downX = e.clientX;
            _downY = e.clientY;
            _downT = performance.now();
            canvas.classList.add("arrastando");
          } else if (ponteiros.size === 2) {
            const ps = [...ponteiros.values()];
            pinchDist0 = Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y);
          }
        });

        canvas.addEventListener("pointermove", (e) => {
          if (ponteiros.has(e.pointerId)) {
            const pt = ponteiros.get(e.pointerId);
            const dx = e.clientX - pt.x,
              dy = e.clientY - pt.y;
            pt.x = e.clientX;
            pt.y = e.clientY;
            if (ponteiros.size === 2) {
              // pinça: zoom proporcional à variação da distância entre dedos
              const ps = [...ponteiros.values()];
              const d = Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y);
              if (pinchDist0 > 0 && d > 0) {
                cancelarTween();
                cam.dist = clamp((cam.dist * pinchDist0) / d, MIN_DIST, MAX_DIST);
                pinchDist0 = d;
              }
              return;
            }
            if (arrastando) {
              if (Math.abs(e.clientX - _downX) + Math.abs(e.clientY - _downY) > 6) _moveu = true;
              if (_moveu) {
                cancelarTween();
                cam.yaw += dx * 0.0052; // arrasto = orbitar
                cam.pitch = clamp(cam.pitch + dy * 0.0042, PITCH_MIN, PITCH_MAX);
              }
            }
          } else {
            // hover (mouse solto): cursor + tooltip mínimo
            hoverPino = pinoEm(e.clientX, e.clientY);
            canvas.classList.toggle("sobre-pino", !!hoverPino);
            if (hoverPino) {
              tooltip.textContent = hoverPino.poi.nome;
              tooltip.style.display = "block";
              const tx = clamp(e.clientX + 14, 0, larguraTela - 260),
                ty = clamp(e.clientY - 30, 0, alturaTela - 40);
              tooltip.style.left = tx + "px";
              tooltip.style.top = ty + "px";
            } else {
              tooltip.style.display = "none";
            }
          }
        });

        function soltarPointer(e) {
          ponteiros.delete(e.pointerId);
          if (ponteiros.size < 2) pinchDist0 = 0;
          if (ponteiros.size === 1) {
            // saiu da pinça para um dedo só: evita "toque fantasma" com a âncora antiga
            _moveu = true;
            const restante = [...ponteiros.values()][0];
            _downX = restante.x;
            _downY = restante.y;
          }
          if (ponteiros.size === 0) {
            canvas.classList.remove("arrastando");
            // janela larga: o que define o toque é NÃO ter arrastado (>6px),
            // não a duração do press — entradas lentas (fila sintética/dispositivo
            // carregado) continuam sendo toques válidos
            const foiToque = !_moveu && performance.now() - _downT < 2500;
            arrastando = false;
            if (foiToque) {
              hoverPino = pinoEm(e.clientX, e.clientY);
              if (hoverPino) {
                selecionarPoi(hoverPino.poi, true);
              } else if (selecionado) {
                fecharPainel();
              }
            }
          }
        }
        canvas.addEventListener("pointerup", soltarPointer);
        canvas.addEventListener("pointercancel", soltarPointer);

        canvas.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            cancelarTween();
            cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), MIN_DIST, MAX_DIST);
          },
          { passive: false }
        );

        canvas.addEventListener("dblclick", () => redefinirCamera());
        canvas.addEventListener("contextmenu", (e) => e.preventDefault());

        // teclado: Tab/cursor circulam os pins; Enter abre; Esc fecha; setas orbitam
        let indiceTeclado = -1;
        canvas.addEventListener("keydown", (e) => {
          const pinsVisiveis = PINOS.filter((p) => p.visivel);
          if (e.key === "Escape") {
            fecharPainel();
            return;
          }
          if (e.key === "Tab" || e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            if (!pinsVisiveis.length) {
              return;
            }
            const delta = e.key === "ArrowUp" ? -1 : 1;
            indiceTeclado = (indiceTeclado + delta + pinsVisiveis.length) % pinsVisiveis.length;
            hoverPino = pinsVisiveis[indiceTeclado];
            srEstado.textContent =
              "Marcador: " + hoverPino.poi.nome + " — pressione Enter para abrir.";
          } else if (e.key === "Enter" || e.key === " ") {
            if (hoverPino) {
              e.preventDefault();
              selecionarPoi(hoverPino.poi, true);
            }
          } else if (e.key === "ArrowLeft") {
            e.preventDefault();
            cancelarTween();
            cam.yaw -= 0.12;
          } else if (e.key === "ArrowRight") {
            e.preventDefault();
            cancelarTween();
            cam.yaw += 0.12;
          }
        });

        document.getElementById("btn-redefinir").addEventListener("click", () => redefinirCamera());

        // W5.4: Exportar vista como PNG. Esconde HUDs temporariamente pra
        // não virarem parte da imagem, renderiza 1 frame extra, depois restaura.
        const btnExportar = document.getElementById("exportarPNG");
        if (btnExportar) {
          btnExportar.addEventListener("click", () => {
            const huds = document.querySelectorAll(".hud, #minimap, #painel, #vinheta");
            const prev = [];
            huds.forEach((h, i) => {
              prev[i] = h.style.display;
              h.style.display = "none";
            });
            // 1 frame extra sem HUDs (requestAnimationFrame do quadro() está rodando)
            requestAnimationFrame(() => {
              canvas.toBlob((blob) => {
                if (!blob) {
                  huds.forEach((h, i) => (h.style.display = prev[i] || ""));
                  return;
                }
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                const ts = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
                a.href = url;
                a.download = `aetheria-mapa-${ts}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                // restaura HUDs imediatamente (sem esperar próximo frame)
                huds.forEach((h, i) => (h.style.display = prev[i] || ""));
              }, "image/png");
            });
          });
        }

        function redefinirCamera() {
          indiceTeclado = -1;
          iniciarTween(Object.assign({}, HOME), 750);
        }

        /* ============================================================
   6. UI — painel, camadas, integração com a galeria
   ============================================================ */

        const painel = document.getElementById("painel");
        const pKicker = document.getElementById("p-kicker");
        const pNome = document.getElementById("p-nome");
        const pDesc = document.getElementById("p-desc");
        const pTituloBloco = document.getElementById("p-racas-titulo");
        const pChips = document.getElementById("p-racas");
        const pWrapChips = document.getElementById("p-racas-wrap");
        const tooltip = document.getElementById("tooltip");
        const srEstado = document.getElementById("sr-estado");
        const apiStatus = document.getElementById("api-status");

        function montarChip(r) {
          const a = document.createElement("a");
          a.className = "raca-chip";
          a.href = "index.html#" + r.folder; // deep-link na galeria (patch futuro aplica o hash)
          a.target = "_self";
          a.style.setProperty("--cor", r.cor);
          a.setAttribute("aria-label", r.nome + " — abrir na galeria");
          const ponto = document.createElement("span");
          ponto.className = "ponto";
          const nome = document.createElement("span");
          nome.textContent = r.nome;
          a.appendChild(ponto);
          a.appendChild(nome);
          if (CONTAGENS && typeof CONTAGENS[r.folder] === "number") {
            const ct = document.createElement("span");
            ct.className = "contagem";
            ct.textContent = "· " + CONTAGENS[r.folder];
            ct.title = CONTAGENS[r.folder] + " personagens na galeria";
            a.appendChild(ct);
          }
          return a;
        }

        function renderizarPainel(p) {
          pKicker.textContent = ROTULO_TIPO[p.tipo];
          pNome.textContent = p.nome;
          pDesc.textContent = p.desc;
          pTituloBloco.textContent = ROTULO_BLOCO[p.tipo];
          pChips.innerHTML = "";
          if (p.tipo === "batalha") {
            for (let l = 0; l < p.lados.length; l++) {
              if (l > 0) {
                const vs = document.createElement("span");
                vs.className = "vs";
                vs.textContent = "VS";
                pChips.appendChild(vs);
              }
              for (const r of p.lados[l]) pChips.appendChild(montarChip(r));
            }
          } else {
            for (const r of p.racas) pChips.appendChild(montarChip(r));
          }
          painel.dataset.tipo = p.tipo;
        }

        function selecionarPoi(p, comFoco) {
          hoverPino = null;
          tooltip.style.display = "none"; // tooltip não sobrevive à seleção
          selecionado = p.id;
          document.body.classList.add("com-painel"); // desliza os chips p/ fora do painel
          renderizarPainel(p);
          painel.classList.add("aberto");
          painel.setAttribute("aria-hidden", "false");
          srEstado.textContent = ROTULO_TIPO[p.tipo] + ": " + p.nome;
          document.getElementById("fechar").focus({ preventScroll: true });
          if (comFoco) {
            // pequeno "focus" de câmera: aproxima e inclina levemente para o POI
            const pn = PINOS.find((q) => q.poi === p);
            if (pn) {
              const alvoY = p.tipo === "ceu" ? pn.solo + pn.alt * 0.45 : pn.solo;
              iniciarTween(
                {
                  tx: lerp(cam.tx, pn.wx, 0.6),
                  ty: lerp(cam.ty, alvoY + 6, 0.6),
                  tz: lerp(cam.tz, pn.wz, 0.6),
                  dist: clamp(cam.dist * 0.8, 360, 900),
                  pitch: clamp(cam.pitch + 0.04, PITCH_MIN, PITCH_MAX),
                  yaw: cam.yaw
                },
                650
              );
            }
          }
        }

        function fecharPainel() {
          if (!selecionado && !painel.classList.contains("aberto")) return;
          selecionado = null;
          document.body.classList.remove("com-painel");
          painel.classList.remove("aberto");
          painel.setAttribute("aria-hidden", "true");
          tooltip.style.display = "none";
          canvas.focus({ preventScroll: true });
        }

        document.getElementById("fechar").addEventListener("click", fecharPainel);
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && document.activeElement !== canvas) fecharPainel();
        });

        // ---- camadas (chips) ----
        const CHIPS = [...document.querySelectorAll(".chip[data-camada]")];
        CHIPS.forEach((ch) => {
          ch.addEventListener("click", () => {
            const nome = ch.dataset.camada;
            CAMADAS[nome] = !CAMADAS[nome];
            const ativo = CAMADAS[nome];
            ch.classList.toggle("ativo", ativo);
            ch.setAttribute("aria-pressed", String(ativo));
            if (!ativo && selecionado) {
              const p = POIS.find((q) => q.id === selecionado);
              const chave =
                p.tipo === "regiao" ? "regioes" : p.tipo === "batalha" ? "batalhas" : "ceus";
              if (chave === nome) fecharPainel();
            }
          });
        });

        /* ---- integração com os dados ----
   POIs, raças, cores, copy e contagens vêm de ./historia-api.json
   (races[].count já traz o nº de personagens — não há segunda busca).
   A carga acontece no bootstrap ao final do script; em caso de falha,
   o FALLBACK embutido assume silenciosamente. */

        /* ---- redimensionamento / visibilidade / reduced motion ---- */
        const mqRM = window.matchMedia("(prefers-reduced-motion: reduce)");
        let RM = mqRM.matches;
        mqRM.addEventListener("change", (e) => {
          RM = e.matches;
        });

        let _redimTimer = null;
        window.addEventListener("resize", () => {
          clearTimeout(_redimTimer);
          _redimTimer = setTimeout(redimensionar, 120);
        });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            /* rAF é suspenso pelo navegador; nada acumula */
          } else {
            _ultimoT = performance.now();
            requestAnimationFrame(quadro);
          }
        });

        /* ---- gancho mínimo para diagnóstico/testes ---- */
        window.__MAPA__ = {
          telaDePOI(id) {
            const pn = PINOS.find((q) => q.poi.id === id);
            if (!pn || !pn.visivel) return null;
            return { x: pn.tx, y: pn.ty, base: { x: pn.bx, y: pn.by } };
          },
          ids() {
            return PINOS.map((p) => p.poi.id);
          },
          // §6.2 — expõe battles pra teste (já com era+data carregados)
          battles() {
            return POIS.filter((p) => p.tipo === "batalha").map((p) => ({
              id: p.id,
              era: p.era,
              data: p.data,
              nome: p.nome
            }));
          },
          // §6.3 — expõe seleção de POI pra teste (gera chips no painel)
          selecionar(id) {
            const p = POIS.find((q) => q.id === id);
            if (p) selecionarPoi(p, false);
          },
          // diagnóstico: de onde vieram os dados ("api" em http | "fallback" embutido)
          fonte() {
            return DADOS === FALLBACK ? "fallback" : "api";
          },
          estado() {
            return {
              dist: +cam.dist.toFixed(1),
              yaw: +cam.yaw.toFixed(3),
              pitch: +cam.pitch.toFixed(3),
              pinsVisiveis: PINOS.filter((p) => p.visivel).length,
              itens: nItens,
              msQuadro: +tempoQuadroMedio.toFixed(2),
              painelAberto: painel.classList.contains("aberto"),
              camadas: Object.assign({}, CAMADAS)
            };
          },
          abrir(id) {
            const p = POIS.find((q) => q.id === id);
            if (p) selecionarPoi(p, false);
          },
          // diagnóstico: posiciona a câmera (usado pelos testes automatizados)
          camera(p) {
            cancelarTween();
            Object.assign(cam, p);
          },
          // diagnóstico: faces emissivas por tipo (lava = quente, veios = frias)
          contagemEmissiva() {
            let lava = 0,
              veios = 0;
            for (let q = 0; q < NUM_CELULAS; q++) {
              if (!Q_EMISSIVO[q]) continue;
              if (Q_EMCOR[q * 3 + 2] > Q_EMCOR[q * 3]) veios++;
              else lava++;
            }
            return { lava, veios };
          }
        };

        /* ---- partida: dados -> terreno -> laço de renderização ---- */
        let _partiu = false;
        function partir() {
          if (_partiu) return;
          _partiu = true;
          construirTerreno();
          construirQuads();
          construirPinos();
          redimensionar();
          atualizarCamera();
          _ultimoT = performance.now();
          requestAnimationFrame(quadro);
        }

        (async function iniciar() {
          if (location.protocol === "file:") {
            aplicarDados(FALLBACK); // fetch é bloqueado em file://: nem tenta
            popularFiltroRaca(null);
          } else {
            apiStatus.classList.add("visivel");
            try {
              const r = await fetch("./historia-api.json", {
                cache: "no-cache"
              });
              if (!r.ok) throw new Error("HTTP " + r.status);
              aplicarDados(await r.json());
            } catch (err) {
              aplicarDados(FALLBACK); // falha silenciosa: o mapa segue integral
            } finally {
              apiStatus.classList.remove("visivel");
            }
            // Carrega characters-api.json em paralelo (não bloqueia o boot)
            fetch("./characters-api.json", { cache: "no-cache" })
              .then((r) => (r.ok ? r.json() : null))
              .then(popularFiltroRaca)
              .catch(() => popularFiltroRaca(null));
          }
          partir();
          // §6.2 — PINOS só existe após partir(); chamamos narrConstruirSeq aqui
          if (typeof narrConstruirSeq === "function") narrConstruirSeq();
        })();

        // W5.3: popula o <select> com as 22 raças vindas da characters-api.json.
        // api = { groups: [{folder, label, icon, count}, ...] }
        function popularFiltroRaca(api) {
          const sel = document.getElementById("filtroRaca");
          if (!sel) return;
          // Limpa options existentes (mantém o "Todas" como primeiro)
          sel.length = 1;
          const grupos = api && Array.isArray(api.groups) ? api.groups : [];
          // Ordena por label humano
          grupos
            .slice()
            .sort((a, b) => a.label.localeCompare(b.label, "pt-BR"))
            .forEach((g) => {
              const opt = document.createElement("option");
              opt.value = g.folder;
              opt.textContent = `${g.icon || "•"} ${g.label} (${g.count || 0})`;
              sel.appendChild(opt);
            });
          if (FILTRO_RACA && grupos.some((g) => g.folder === FILTRO_RACA)) {
            sel.value = FILTRO_RACA;
          }
          sel.addEventListener("change", () => {
            FILTRO_RACA = sel.value;
            try {
              localStorage.setItem("mapaFiltroRaca", FILTRO_RACA);
            } catch (e) {}
          });

          // §6.3 — Filtro de era (I-IV). Listener separado: a era vem da
          // historia-api.json e é independente da characters-api.json. Filtro
          // só esconde battles; regiões e céus ficam visíveis mesmo com era
          // setada, para não dar "mapa vazio" se o usuário erra o filtro.
          const selEra = document.getElementById("filtroEra");
          if (selEra) {
            if (FILTRO_ERA && ["I", "II", "III", "IV"].includes(FILTRO_ERA)) {
              selEra.value = FILTRO_ERA;
            }
            selEra.addEventListener("change", () => {
              FILTRO_ERA = selEra.value;
              try {
                localStorage.setItem("mapaFiltroEra", FILTRO_ERA);
              } catch (e) {}
            });
          }
        }

        /* ============================================================
     §6.2 — ROTA NARRATIVA
     Player em bottom-sheet que conta a história do mundo movendo a câmera
     entre as 5 battles em ordem cronológica. Reaproveita iniciarTween() e
     selecionarPoi() — não duplica lógica de câmera.
     ============================================================ */
        const NARR_INTROS = {
          I: "A infantaria humana avança para o norte e encontra os primeiros Aspectos emergindo do gelo. A guerra dos milênios começa.",
          II: "As cumes se transformam em arena. Bárbaros e Semi-Deuses disputam o controle das passagens de montanha.",
          III: "Nos laboratórios subterrâneos, as cobaias se rebelam. A maior estrutura arcana do continente cai em horas.",
          IV: "O Vazio se abre. Avatares divinos descem para o ponto de impacto. A batalha que rasga a física do mundo começa."
        };
        const NARR_TITULOS = {
          I: "A Queda do Norte",
          II: "Os Cumes em Chamas",
          III: "A Ruptura da Fenda",
          IV: "O Vazio Desperta"
        };

        const NARR = {
          ativas: false,
          idx: 0, // 0..4 (5 battles)
          timer: null,
          seq: [], // [{pn, poi}] em ordem cronológica (5 itens)
          // §6.2.3 — flags expostas para o teste
          __ultimoTween: 0 // performance.now() do último tween disparado
        };

        // IIFE que monta a sequência de battles. Roda uma vez depois de aplicarDados().
        function narrConstruirSeq() {
          // Filtra só battles com era definida e ordena por era → v (norte→sul é a ordem cronológica).
          const battles = POIS.filter((p) => p.tipo === "batalha" && p.era);
          const ordemEra = { I: 0, II: 1, III: 2, IV: 3 };
          battles.sort((a, b) => {
            const ea = ordemEra[a.era] ?? 99;
            const eb = ordemEra[b.era] ?? 99;
            if (ea !== eb) return ea - eb;
            return a.v - b.v; // dentro da mesma era, mais ao norte primeiro
          });
          NARR.seq = battles
            .map((poi) => {
              const pn = PINOS.find((p) => p.poi === poi);
              return { pn, poi };
            })
            .filter((x) => x.pn); // descarta se algum pino não foi construído
          // expõe para teste
          window.__NARR__ = NARR;
        }

        const narrBtn = document.getElementById("narrBtn");
        const narrSheet = document.getElementById("narrSheet");
        const narrClose = document.getElementById("narrClose");
        const narrActs = document.getElementById("narrActs");
        const narrActNum = document.getElementById("narrActNum");
        const narrActData = document.getElementById("narrActData");
        const narrActTitle = document.getElementById("narrActTitle");
        const narrActIntro = document.getElementById("narrActIntro");
        const narrBattleName = document.getElementById("narrBattleName");
        const narrPlay = document.getElementById("narrPlay");
        const narrPrev = document.getElementById("narrPrev");
        const narrNext = document.getElementById("narrNext");
        const narrScrub = document.getElementById("narrScrub");
        const narrCounter = document.getElementById("narrCounter");

        // §6.2 — botões de ato (4, mesmo se a era IV tiver 2 battles).
        // Cada botão pula pro 1º battle daquela era.
        function narrConstruirActs() {
          narrActs.innerHTML = "";
          const erasPresentes = [...new Set(NARR.seq.map((x) => x.poi.era))].sort();
          for (const era of erasPresentes) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "narr-act";
            btn.dataset.era = era;
            btn.setAttribute("role", "tab");
            btn.setAttribute("aria-pressed", "false");
            btn.textContent = `Ato ${era}`;
            btn.addEventListener("click", () => {
              narrParar();
              const idxEra = NARR.seq.findIndex((x) => x.poi.era === era);
              if (idxEra >= 0) narrIr(idxEra);
            });
            narrActs.appendChild(btn);
          }
        }

        function narrAbrir() {
          if (NARR.seq.length === 0) return; // API ainda não carregou
          NARR.ativas = true;
          narrSheet.hidden = false;
          narrSheet.dataset.open = "true";
          narrSheet.setAttribute("aria-hidden", "false");
          narrBtn.setAttribute("aria-expanded", "true");
          narrConstruirActs();
          narrIr(0);
          // expõe flag pra teste
          window.__NARR_SHEET_OPEN__ = true;
        }
        function narrFechar() {
          narrParar();
          NARR.ativas = false;
          narrSheet.dataset.open = "false";
          narrSheet.setAttribute("aria-hidden", "true");
          // pequeno delay pra animação de slide-down não cortar abruptamente
          setTimeout(() => {
            if (!NARR.ativas) narrSheet.hidden = true;
          }, 320);
          narrBtn.setAttribute("aria-expanded", "false");
          window.__NARR_SHEET_OPEN__ = false;
        }

        function narrIr(idx) {
          if (idx < 0 || idx >= NARR.seq.length) return;
          NARR.idx = idx;
          const { pn, poi } = NARR.seq[idx];
          // marca pino como 'em rota' (halo extra)
          pn.emRota = true;
          // §6.2.2 — atualiza UI do sheet
          narrActNum.textContent = `Ato ${poi.era}`;
          narrActData.textContent = poi.data || "";
          narrActTitle.textContent = NARR_TITULOS[poi.era] || poi.nome;
          narrActIntro.textContent = NARR_INTROS[poi.era] || "";
          narrBattleName.textContent = `→ ${poi.nome}`;
          // marca ato ativo na lista
          for (const b of narrActs.children) {
            b.setAttribute("aria-pressed", b.dataset.era === poi.era ? "true" : "false");
          }
          // scrub + counter
          narrScrub.value = String(idx);
          narrCounter.textContent = `${idx + 1} / ${NARR.seq.length}`;
          // §6.2.2 — move a câmera (reusa iniciarTween, já com cap RM)
          const alvoY = pn.solo;
          const dur = RM ? 180 : 800;
          NARR.__ultimoTween = performance.now();
          iniciarTween(
            {
              tx: lerp(cam.tx, pn.wx, 0.7),
              ty: lerp(cam.ty, alvoY + 6, 0.6),
              tz: lerp(cam.tz, pn.wz, 0.7),
              dist: clamp(cam.dist * 0.85, 360, 900),
              pitch: clamp(cam.pitch + 0.02, PITCH_MIN, PITCH_MAX),
              yaw: cam.yaw
            },
            dur
          );
          // anuncia para leitor de tela
          srEstado.textContent = `Ato ${poi.era}: ${NARR_TITULOS[poi.era] || poi.nome}. ${poi.nome}.`;
          // §6.2.3 — flag de teste: tween acabou
          setTimeout(() => {
            NARR.__ultimoTween = 0;
          }, dur + 50);
        }

        function narrTocar() {
          if (NARR.seq.length === 0) return;
          NARR.ativas = true;
          const intervalo = RM ? 12000 : 8000;
          NARR.timer = setInterval(() => {
            const prox = NARR.idx + 1;
            if (prox >= NARR.seq.length) {
              narrParar();
              narrPlay.textContent = "✔";
              setTimeout(() => {
                narrPlay.textContent = "▶";
                narrIr(0);
              }, 2000);
              return;
            }
            narrIr(prox);
          }, intervalo);
          narrPlay.textContent = "❚❚";
          narrPlay.setAttribute("aria-label", "Pausar narração");
        }
        function narrParar() {
          if (NARR.timer) {
            clearInterval(NARR.timer);
            NARR.timer = null;
          }
          narrPlay.textContent = "▶";
          narrPlay.setAttribute("aria-label", "Iniciar narração");
        }

        // listeners (só liga se os elementos existirem — testes headless quebram se não tiver)
        if (narrBtn) {
          narrBtn.addEventListener("click", () => {
            if (NARR.ativas) narrFechar();
            else narrAbrir();
          });
        }
        if (narrClose) narrClose.addEventListener("click", narrFechar);
        if (narrPlay)
          narrPlay.addEventListener("click", () => {
            if (NARR.timer) narrParar();
            else narrTocar();
          });
        if (narrPrev)
          narrPrev.addEventListener("click", () => {
            narrParar();
            narrIr(NARR.idx - 1);
          });
        if (narrNext)
          narrNext.addEventListener("click", () => {
            narrParar();
            narrIr(NARR.idx + 1);
          });
        if (narrScrub) {
          // input só atualiza o counter (não teleportar a câmera a cada pixel)
          narrScrub.addEventListener("input", () => {
            narrCounter.textContent = `${Number(narrScrub.value) + 1} / ${NARR.seq.length}`;
          });
          // change (mouseup) confirma e vai
          narrScrub.addEventListener("change", () => {
            narrParar();
            narrIr(Number(narrScrub.value));
          });
        }
        // Esc fecha o sheet
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && NARR.ativas) {
            narrFechar();
            narrBtn.focus();
          }
        });

        // §6.2 — polilinha animada: desenhada no quadro(), antes dos pinos.
        // Precisa estar em escopo acessível pelo render loop. Função global no
        // módulo; chamada condicional pelo quadro().
        function narrDesenharTrilha(agora) {
          if (!NARR.ativas || NARR.seq.length < 2) return;
          // cor = média ponderada das cores das battles (todas vermelho #E2483D aqui)
          ctx.save();
          ctx.lineWidth = 2.4;
          ctx.strokeStyle = "rgba(226, 72, 61, 0.85)";
          ctx.shadowColor = "rgba(226, 72, 61, 0.7)";
          ctx.shadowBlur = 12;
          if (!RM) {
            ctx.setLineDash([4, 8]);
            ctx.lineDashOffset = -(agora * 0.04) % 12;
          } else {
            ctx.setLineDash([]);
          }
          ctx.beginPath();
          let primeiro = true;
          for (const { pn } of NARR.seq) {
            if (!pn || !pn.visivel) continue;
            const sx = pn.bx; // projeção x do solo (atualizada em atualizarPinos)
            const sy = pn.by; // projeção y do solo
            if (primeiro) {
              ctx.moveTo(sx, sy);
              primeiro = false;
            } else {
              ctx.lineTo(sx, sy);
            }
          }
          ctx.stroke();
          ctx.restore();
        }

        // §6.2.2 — pino "em rota" ganha halo extra. Patch simples no final do
        // quadro(), antes de desenharPino, é difícil sem reescrever — então
        // sobrescrevemos uma flag visual via classList no elemento se houver;
        // como é canvas, controlamos via pn.glow que desenharPino já respeita.
        // (Aqui só garantimos que a flag existe; desenho fica em desenharPino.)
        // Hook no quadro: após passoTween/atualizarCamera e antes de desenhar os
        // pinos, desenhamos a trilha. Modificar quadro() via wrapper seria
        // invasivo; em vez disso, expomos um hook: o quadro chama
        // `narrDesenharTrilha(agora)` se o hook foi registrado.
        // Solução limpa: monkey-patch é risco; em vez disso, injetamos via
        // hookOnFrame abaixo (chamado de quadro).
        function narrFrameHook(agora) {
          narrDesenharTrilha(agora);
        }
      })();
    </script>
  </body>
</html>
