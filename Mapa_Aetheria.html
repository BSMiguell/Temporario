<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aetheria · Mapa do Mundo</title>
    <meta
      name="description"
      content="Mapa 3D interativo do continente de Aetheria: regiões, grandes batalhas e entidades celestes do códice."
    />
    <!-- Favicon embutido (evita requisição externa / 404 no console) -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1l5 7-5 7-5-7z' fill='%23C9A227'/%3E%3C/svg%3E"
    />
    <!-- Fonte de título (com fallback serif gracioso: offline o mapa segue 100% funcional) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================================
   MESA DE GUERRA ARCANA — estilos
   ============================================================ */
      :root {
        --fundo: #070b14;
        --fundo2: #0d1424;
        --painel: rgba(16, 24, 40, 0.95); /* #101828F2 */
        --ouro: #c9a227; /* ouro envelhecido */
        --ouro-borda: rgba(201, 162, 39, 0.33);
        --texto: #e8e3d5;
        --batalha: #e2483d;
        --ceus: #7fbfb0;
        --fonte-display: "Cinzel", Georgia, "Times New Roman", serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: radial-gradient(
          120% 90% at 50% 42%,
          var(--fundo2) 0%,
          var(--fundo) 60%,
          #04060c 100%
        );
        color: var(--texto);
        overflow: hidden;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* ---- palco 3D ---- */
      #mapa {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
        outline: none;
      }
      #mapa.arrastando {
        cursor: grabbing;
      }
      #mapa.sobre-pino {
        cursor: pointer;
      }
      #mapa:focus-visible {
        outline: 1px solid var(--ouro-borda);
        outline-offset: -8px;
      }

      /* vinheta por cima do canvas, abaixo da HUD */
      #vinheta {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        background: radial-gradient(
          118% 88% at 50% 44%,
          transparent 52%,
          rgba(3, 5, 10, 0.62) 100%
        );
      }

      /* ---- HUD comum ---- */
      .hud {
        position: fixed;
        z-index: 10;
      }

      .hud-titulo {
        top: 22px;
        left: 26px;
        pointer-events: none;
        user-select: none;
      }
      .hud-titulo h1 {
        font-family: var(--fonte-display);
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.34em;
        color: var(--ouro);
        text-shadow: 0 0 22px rgba(201, 162, 39, 0.32);
      }
      .hud-titulo h1 span {
        letter-spacing: 0.34em;
        margin-right: -0.34em;
      } /* compensa o espaçamento final */
      .hud-titulo p {
        margin-top: 5px;
        font-size: 11.5px;
        letter-spacing: 0.16em;
        color: rgba(232, 227, 213, 0.62);
        text-transform: uppercase;
      }

      /* ---- chips de camada + redefinir (topo-direita) ---- */
      .hud-controles {
        top: 22px;
        right: 22px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
        transition:
          right 0.45s cubic-bezier(0.22, 0.8, 0.24, 1),
          opacity 0.25s ease,
          visibility 0.25s;
      }
      /* Painel aberto em telas largas: shift fixo deixa o chip mais largo inteiro
   fora do painel (painel começa a vw-390; chips passam a terminar em vw-430) */
      @media (min-width: 1094px) {
        body.com-painel .hud-controles {
          right: 410px;
        }
      }
      /* Faixa intermediária (721–1093): não há vão limpo entre o título e o painel —
   os chips descem para a base-esquerda em coluna (cabe até no 768 retrato),
   e a legenda decorativa sai de cena enquanto o painel está aberto */
      @media (min-width: 721px) and (max-width: 1093px) {
        body.com-painel .hud-controles {
          top: auto;
          bottom: 20px;
          left: 22px;
          right: auto;
          align-items: flex-start;
        }
        body.com-painel .hud-controles .chips {
          flex-direction: column;
          align-items: flex-start;
          flex-wrap: nowrap;
        }
        body.com-painel .hud-legenda {
          opacity: 0;
        }
      }
      /* Mobile: a bottom-sheet cobre os chips — ficam ocultos e sem clique */
      @media (max-width: 720px) {
        body.com-painel .hud-controles {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 13px;
        border-radius: 999px;
        border: 1px solid var(--ouro-borda);
        background: rgba(16, 24, 40, 0.74);
        color: var(--texto);
        font-size: 12.5px;
        letter-spacing: 0.06em;
        cursor: pointer;
        font-family: inherit;
        transition:
          border-color 0.2s,
          opacity 0.2s,
          background 0.2s;
        backdrop-filter: blur(3px);
      }
      .chip svg {
        width: 12px;
        height: 12px;
        flex: none;
        display: block;
      }
      .chip .sel {
        display: none;
      }
      .chip.ativo {
        border-color: var(--ouro);
      }
      .chip.ativo .sel {
        display: block;
      }
      .chip.ativo .nao-sel {
        display: none;
      }
      .chip.sem-camada {
        opacity: 0.5;
      }
      .chip:not(.ativo) {
        opacity: 0.62;
      }
      .chip:hover {
        background: rgba(29, 40, 64, 0.9);
        opacity: 1;
      }
      .chip:focus-visible {
        outline: 1px solid var(--ouro);
      }

      #api-status {
        display: none;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(232, 227, 213, 0.55);
      }
      #api-status.visivel {
        display: inline-flex;
      }
      .spin {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        border: 1.5px solid rgba(201, 162, 39, 0.25);
        border-top-color: var(--ouro);
        animation: girar 1s linear infinite;
        flex: none;
      }
      @keyframes girar {
        to {
          transform: rotate(360deg);
        }
      }

      /* ---- legenda (base-esquerda) ---- */
      .hud-legenda {
        left: 26px;
        bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        font-size: 11.5px;
        letter-spacing: 0.08em;
        color: rgba(232, 227, 213, 0.58);
        pointer-events: none;
        user-select: none;
        transition: opacity 0.25s ease;
      }
      .leg-item {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .leg-item svg {
        width: 15px;
        height: 15px;
        flex: none;
      }

      /* ---- tooltip de hover ---- */
      #tooltip {
        position: fixed;
        z-index: 20;
        pointer-events: none;
        display: none;
        background: rgba(16, 24, 40, 0.94);
        border: 1px solid var(--ouro-borda);
        color: var(--texto);
        font-size: 12.5px;
        letter-spacing: 0.03em;
        padding: 5px 11px;
        border-radius: 8px;
        max-width: 250px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      }

      /* ---- painel lateral ---- */
      /* Altura acompanha o conteúdo (max-height), sem esticar até o rodapé */
      #painel {
        position: fixed;
        z-index: 30;
        top: 18px;
        right: 18px;
        bottom: auto;
        max-height: calc(100vh - 36px);
        width: min(372px, calc(100vw - 36px));
        background: var(--painel);
        border: 1px solid var(--ouro-borda);
        border-radius: 14px;
        padding: 26px 26px 18px;
        overflow-y: auto;
        overscroll-behavior: contain;
        transform: translateX(calc(100% + 40px));
        visibility: hidden;
        transition: transform 0.45s cubic-bezier(0.22, 0.8, 0.24, 1);
        box-shadow:
          0 14px 50px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.045);
        scrollbar-width: thin;
        scrollbar-color: rgba(201, 162, 39, 0.35) transparent;
      }
      #painel.aberto {
        transform: translateX(0);
        visibility: visible;
      }
      #painel::-webkit-scrollbar {
        width: 8px;
      }
      #painel::-webkit-scrollbar-thumb {
        background: rgba(201, 162, 39, 0.3);
        border-radius: 4px;
      }

      #fechar {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 32px;
        height: 32px;
        border-radius: 9px;
        border: 1px solid transparent;
        background: transparent;
        color: rgba(232, 227, 213, 0.68);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #fechar:hover {
        border-color: var(--ouro-borda);
        color: var(--texto);
      }
      #fechar svg {
        width: 14px;
        height: 14px;
      }

      #p-kicker {
        font-size: 10.5px;
        letter-spacing: 0.26em;
        font-weight: 600;
        color: var(--ouro);
        margin-bottom: 12px;
      }
      #painel[data-tipo="batalha"] #p-kicker {
        color: var(--batalha);
      }
      #painel[data-tipo="ceu"] #p-kicker {
        color: var(--ceus);
      }

      #p-nome {
        font-family: var(--fonte-display);
        font-weight: 700;
        font-size: 25px;
        line-height: 1.22;
        color: var(--ouro);
        margin-bottom: 13px;
        padding-right: 26px;
      }
      #p-desc {
        font-size: 14px;
        line-height: 1.68;
        color: rgba(232, 227, 213, 0.88);
        margin-bottom: 22px;
      }

      #p-racas-titulo {
        font-size: 10.5px;
        letter-spacing: 0.24em;
        font-weight: 600;
        color: rgba(201, 162, 39, 0.78);
        margin-bottom: 11px;
      }
      .raca-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .vs {
        font-family: var(--fonte-display);
        font-size: 11px;
        letter-spacing: 0.18em;
        color: rgba(232, 227, 213, 0.45);
        padding: 0 2px;
      }
      .raca-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px 6px 9px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        background: rgba(255, 255, 255, 0.035);
        color: var(--texto);
        text-decoration: none;
        font-size: 12.5px;
        transition:
          border-color 0.2s,
          background 0.2s,
          transform 0.15s;
      }
      .raca-chip:hover,
      .raca-chip:focus-visible {
        border-color: var(--cor, var(--ouro));
        background: rgba(255, 255, 255, 0.07);
        transform: translateY(-1px);
      }
      .raca-chip .ponto {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--cor, #888);
        box-shadow: 0 0 8px var(--cor, #888);
        flex: none;
      }
      .raca-chip .contagem {
        font-variant-numeric: tabular-nums;
        color: rgba(232, 227, 213, 0.55);
        font-size: 11.5px;
      }

      #painel footer {
        margin-top: 28px;
        padding-top: 14px;
        border-top: 1px solid rgba(201, 162, 39, 0.16);
        font-size: 11.5px;
        letter-spacing: 0.06em;
        color: rgba(232, 227, 213, 0.5);
      }

      /* ---- utilidades ---- */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        overflow: hidden;
        white-space: nowrap;
      }

      /* ---- responsivo: painel vira bottom-sheet ---- */
      @media (max-width: 720px) {
        .hud-titulo {
          top: 14px;
          left: 16px;
        }
        .hud-titulo h1 {
          font-size: 21px;
        }
        .hud-controles {
          top: auto;
          bottom: 14px;
          left: 14px;
          right: 14px;
          flex-direction: column;
          align-items: center;
        }
        .chips {
          justify-content: center;
        }
        .hud-legenda {
          display: none;
        }
        #painel {
          top: auto;
          left: 0;
          right: 0;
          bottom: 0;
          width: auto;
          max-height: 62vh;
          border-radius: 16px 16px 0 0;
          border-left: none;
          border-right: none;
          border-bottom: none;
          transform: translateY(105%);
        }
        #painel.aberto {
          transform: translateY(0);
        }
      }

      /* ---- W5: Minimap (canto inferior direito) ---- */
      #minimap {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 5;
        background: rgba(16, 24, 40, 0.85);
        border: 1px solid rgba(201, 162, 39, 0.4);
        border-radius: 6px;
        padding: 4px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(4px);
      }
      #minimapCanvas {
        display: block;
        border-radius: 4px;
        cursor: crosshair;
        image-rendering: crisp-edges;
      }
      #minimapHint {
        margin: 2px 0 0;
        text-align: center;
        font-size: 9px;
        color: rgba(201, 162, 39, 0.7);
        letter-spacing: 0.04em;
        font-family: system-ui, sans-serif;
      }

      /* ---- W5.3: Filtro de raça ---- */
      .filtro-raca {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 6px;
        font-family: "Space Grotesk", system-ui, sans-serif;
      }
      .filtro-raca > span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .filtro-raca label {
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(244, 240, 232, 0.7);
      }
      .filtro-raca select {
        background: rgba(16, 24, 40, 0.85);
        color: #faf8f3;
        border: 1px solid rgba(201, 162, 39, 0.4);
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
        max-width: 200px;
      }
      .filtro-raca select:focus {
        outline: 2px solid #c9a227;
        outline-offset: 1px;
      }

      /* ---- W5.4: Botao exportar ---- */
      #exportarPNG {
        background: rgba(201, 162, 39, 0.15);
        color: #c9a227;
        border: 1px solid rgba(201, 162, 39, 0.5);
        border-radius: 4px;
        padding: 5px 10px;
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
        letter-spacing: 0.04em;
        margin-top: 6px;
        width: 100%;
      }
      #exportarPNG:hover {
        background: rgba(201, 162, 39, 0.3);
      }
      #exportarPNG:focus-visible {
        outline: 2px solid #c9a227;
        outline-offset: 1px;
      }

      @media (prefers-reduced-motion: reduce) {
        #painel {
          transition: none;
        }
        .spin {
          animation-duration: 2.4s;
        }
      }

      /* ========== §6.2 — ROTA NARRATIVA ========== */
      #narrBtn {
        position: fixed;
        bottom: 14px;
        left: 14px;
        z-index: 220;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        font:
          600 11px/1 "Cinzel",
          serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #f4ecd8;
        background: rgba(28, 22, 16, 0.88);
        border: 1px solid rgba(244, 236, 216, 0.35);
        border-radius: 4px;
        cursor: pointer;
        backdrop-filter: blur(6px);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        transition:
          background 200ms,
          transform 200ms;
      }
      #narrBtn:hover {
        background: rgba(48, 30, 18, 0.95);
      }
      #narrBtn:active {
        transform: translateY(1px);
      }
      #narrBtn[aria-expanded="true"] {
        background: rgba(226, 72, 61, 0.85);
        border-color: rgba(244, 236, 216, 0.6);
      }

      #narrSheet {
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%) translateY(100%);
        width: min(640px, 96vw);
        max-height: 56vh;
        z-index: 230;
        background: linear-gradient(180deg, rgba(28, 22, 16, 0.97), rgba(14, 10, 6, 0.98));
        border: 1px solid rgba(244, 236, 216, 0.25);
        border-bottom: none;
        border-radius: 8px 8px 0 0;
        color: #f4ecd8;
        font-family: "Inter", system-ui, sans-serif;
        box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
        transition: transform 280ms cubic-bezier(0.2, 0.7, 0.2, 1);
        display: flex;
        flex-direction: column;
      }
      #narrSheet[data-open="true"] {
        transform: translateX(-50%) translateY(0);
      }

      #narrSheet > header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px 6px;
        border-bottom: 1px solid rgba(244, 236, 216, 0.15);
      }
      .narr-kicker {
        margin: 0;
        font:
          600 9px/1 "Cinzel",
          serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(244, 236, 216, 0.55);
        flex: 0 0 auto;
      }
      #narrTitle {
        margin: 0;
        flex: 1;
        font:
          600 13px/1.2 "Cinzel",
          serif;
        letter-spacing: 0.08em;
      }
      #narrClose {
        background: transparent;
        border: none;
        color: #f4ecd8;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        padding: 0 4px;
        opacity: 0.7;
      }
      #narrClose:hover {
        opacity: 1;
      }

      #narrActs {
        display: flex;
        gap: 6px;
        padding: 8px 12px;
        overflow-x: auto;
        border-bottom: 1px solid rgba(244, 236, 216, 0.1);
      }
      .narr-act {
        flex: 0 0 auto;
        padding: 6px 10px;
        background: transparent;
        border: 1px solid rgba(244, 236, 216, 0.2);
        border-radius: 3px;
        color: rgba(244, 236, 216, 0.7);
        font:
          600 10px/1 "Cinzel",
          serif;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .narr-act[aria-pressed="true"] {
        background: rgba(226, 72, 61, 0.7);
        color: #fff;
        border-color: rgba(226, 72, 61, 0.9);
      }

      #narrStage {
        padding: 14px 18px 10px;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        animation: narrFade 400ms ease-out;
      }
      @keyframes narrFade {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .narr-stage-kicker {
        margin: 0 0 4px;
        font:
          600 10px/1 "Cinzel",
          serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #e2483d;
      }
      #narrActTitle {
        margin: 0 0 6px;
        font:
          600 16px/1.2 "Cinzel",
          serif;
      }
      #narrActIntro {
        margin: 0 0 8px;
        font:
          400 12px/1.5 "Inter",
          sans-serif;
        color: rgba(244, 236, 216, 0.85);
      }
      #narrBattleName {
        margin: 0;
        font:
          500 11px/1.4 "Cinzel",
          serif;
        color: rgba(244, 236, 216, 0.55);
        font-style: italic;
      }

      #narrPlayer {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px 12px;
        border-top: 1px solid rgba(244, 236, 216, 0.12);
      }
      #narrPlayer button {
        background: transparent;
        border: 1px solid rgba(244, 236, 216, 0.3);
        color: #f4ecd8;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        font-size: 12px;
        cursor: pointer;
        padding: 0;
        line-height: 1;
      }
      #narrPlayer button:hover {
        background: rgba(244, 236, 216, 0.1);
      }
      #narrPlay {
        background: rgba(226, 72, 61, 0.85);
        border-color: rgba(226, 72, 61, 0.9);
      }
      #narrPlay:hover {
        background: rgba(226, 72, 61, 1);
      }
      #narrScrub {
        flex: 1 1 auto;
        accent-color: #e2483d;
        min-width: 0;
      }
      #narrCounter {
        margin: 0;
        font:
          600 10px/1 "Cinzel",
          serif;
        letter-spacing: 0.1em;
        color: rgba(244, 236, 216, 0.6);
        flex: 0 0 auto;
      }

      @media (max-width: 520px) {
        #narrSheet {
          width: 100vw;

        function atualizarCamera() {
          const cp = Math.cos(cam.pitch),

          olho.x = cam.tx + cam.dist * sy * cp;
          olho.y = cam.ty + cam.dist * sp;
          olho.z = cam.tz + cam.dist * cy * cp;
          // forward = direção olho -> alvo
          let fx = cam.tx - olho.x,
            fy = cam.ty - olho.y,
            fz = cam.tz - olho.z;
          const fl = Math.hypot(fx, fy, fz);
          fx /= fl;
          fy /= fl;
          fz /= fl;
          fwd.x = fx;
          fwd.y = fy;
          fwd.z = fz;
          // right = normalize(cross(forward, mundoUp)) ; up = cross(right, forward)

          const rl = Math.hypot(rx, rz) || 1;
          rx /= rl;
          rz /= rl;
          dir.x = rx;
          dir.y = 0;
          dir.z = rz;
          up.x = dir.y * fz - dir.z * fy;
          up.y = dir.z * fx - dir.x * fz;
          up.z = dir.x * fy - dir.y * fx;
        }

          const s = focal / zv;
          proj.x = larguraTela / 2 + xv * s;
          proj.y = alturaTela / 2 - yv * s;

        }

        function easeInOut(k) {
          return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;

        }
        function ruidoValor(x, z) {
          const ix = Math.floor(x),
            iz = Math.floor(z);
          const fx = x - ix,
            fz = z - iz;
          const sx = fx * fx * (3 - 2 * fx),
            sz = fz * fz * (3 - 2 * fz);
          const a = hash2(ix, iz),
            b = hash2(ix + 1, iz),
            c = hash2(ix, iz + 1),
            d = hash2(ix + 1, iz + 1);
          return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz;
        }
