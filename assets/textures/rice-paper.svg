<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" aria-hidden="true">
  <title>Papel de arroz</title>
  <rect width="200" height="200" fill="#f4f0e8"/>
  <filter id="fiber" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
    <feDiffuseLighting in="noise" lighting-color="#f0ece4" surfaceScale="0.3" result="light"/>
    <feBlend in="SourceGraphic" in2="light" mode="multiply"/>
  </filter>
  <rect width="200" height="200" filter="url(#fiber)" opacity="0.35"/>
</svg>
